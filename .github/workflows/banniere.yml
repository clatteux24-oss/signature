name: Mise à jour de la bannière

on:
  schedule:
    - cron: '0 5 * * *'   # tous les jours vers 7h (heure belge)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  banniere:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les outils
        run: pip install pillow numpy requests

      - name: Générer la bannière
        run: python generer_banniere.py

      - name: Publier si la bannière a changé
        run: |
          git config user.name "banniere-bot"
          git config user.email "banniere-bot@users.noreply.github.com"
          git add banniere.jpg banniere-cote.jpg lien.html
          git diff --cached --quiet || (git commit -m "Bannière : dernière actualité" && git push)
